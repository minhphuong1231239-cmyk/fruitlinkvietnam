<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thử thách toán học</title><style>body{font-family:system-ui;background:#eef2ff;color:#18234c;margin:0;padding:12px}main{max-width:600px;margin:auto}header{background:#5d55d9;color:white;padding:20px;text-align:center;border-radius:18px}h2{margin:0}.rooms,.stats{display:flex;gap:7px;margin:12px 0}.rooms button,.stats div{flex:1}button{font:inherit;border:1px solid #aab4da;border-radius:12px;padding:12px;background:white;color:#25315c}.selected{background:#d9d4ff!important;border:2px solid #6256dc}.card{background:white;padding:14px;border-radius:16px;margin:12px 0}.stats{text-align:center}.stats b{display:block;font-size:21px}.line{display:flex;align-items:center;gap:22px;margin:8px 0}.num{width:35px;text-align:center;background:#e9ecf7;padding:12px 3px;border-radius:8px}.eq{flex:1;display:flex;justify-content:space-between;border:2px solid #e0e5f5;padding:12px;border-radius:10px;font-weight:bold}.line.selected .eq{border-color:#6256dc}.line.done .eq{background:#ddf5e5}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.grid button{padding:12px 0;font-weight:bold}.primary{width:100%;background:#6054d9;color:white;font-weight:bold}.gift{text-align:center;background:#fff2c8;padding:12px;border-radius:12px;margin:10px 0}</style><main><header><h2>🧠 THỬ THÁCH TOÁN HỌC</h2>20 bài • 20 kết quả • 🎁 Quà tặng</header><div class="rooms"><button onclick="roomChange(0)">➕➖ Dễ</button><button onclick="roomChange(1)">✖️➗ Vừa</button><button onclick="roomChange(2)">🧠 Khó</button></div><div class="card stats"><div>Điểm<b id="score">0/20</b></div><div>Thời gian<b id="time">00:00</b></div><div>Quà<b id="gifts">0 🎁</b></div></div><div class="card" id="intro">Chọn phòng rồi nhấn bắt đầu. Đúng 5 câu được một hộp quà ảo.<p><button class="primary" onclick="start()">▶ Bắt đầu chơi</button></p></div><div id="play" hidden><div class="card"><b>20 bài toán</b><div id="qs"></div></div><div class="card"><b>20 kết quả để chọn</b><p id="hint"></p><div class="grid" id="opts"></div><p id="msg"></p><div id="prize"></div><button class="primary" onclick="start()">Chơi lại</button></div></div></main><script>let room=0,problems=[],choices=[],done={},active=0,seconds=0,timer,playing=false;const el=id=>document.getElementById(id);function roomChange(n){room=n;clearInterval(timer);playing=false;el('intro').hidden=false;el('play').hidden=true;document.querySelectorAll('.rooms button').forEach((b,i)=>b.classList.toggle('selected',i===n))}function start(){let seen=new Set;problems=[];for(let t=0;problems.length<20&&t<10000;t++){let a=2+Math.floor(Math.random()*20),b=2+Math.floor(Math.random()*10),k=room===2?Math.floor(Math.random()*4):Math.floor(Math.random()*2),q,v;if(room===0||room===2&&k<2){if(k%2===0){q=a+' + '+b;v=a+b}else{q=(a+b)+' − '+b;v=a}}else{if(k%2===0){q=a+' × '+b;v=a*b}else{q=(a*b)+' ÷ '+b;v=a}}if(!seen.has(v)){seen.add(v);problems.push({q,v})}}choices=problems.map((p,i)=>({v:p.v,i})).sort(()=>Math.random()-.5);done={};active=0;seconds=0;playing=true;el('score').textContent='0/20';el('time').textContent='00:00';el('gifts').textContent='0 🎁';el('msg').textContent='';el('prize').innerHTML='';el('intro').hidden=true;el('play').hidden=false;clearInterval(timer);timer=setInterval(()=>{seconds++;el('time').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},1000);render()}function render(){el('qs').innerHTML=problems.map((p,i)=>'<div class="line '+(i===active?'selected ':'')+(done[i]!==undefined?'done':'')+'" onclick="pick('+i+')"><span class="num">'+(i+1)+'</span><span class="eq">'+p.q+' = <span>'+(done[i]!==undefined?p.v+' ✓':'?')+'</span></span></div>').join('');el('opts').innerHTML=choices.map((c,i)=>'<button '+(Object.values(done).includes(i)?'disabled':'')+' onclick="answer('+i+')">'+c.v+'</button>').join('');el('hint').textContent='Câu '+(active+1)+': '+problems[active].q+' = ?'}function pick(i){if(playing){active=i;render()}}function answer(i){if(!playing||done[active]!==undefined)return;if(choices[i].v!==problems[active].v){el('msg').textContent='❌ Chưa đúng, thử lại nhé!';return}done[active]=i;let n=Object.keys(done).length;el('score').textContent=n+'/20';el('msg').textContent='✅ Đúng rồi! +1 điểm';if(n%5===0){el('gifts').textContent=n/5+' 🎁';el('prize').innerHTML='<div class="gift">🎁 Bạn nhận được hộp quà ảo thứ '+n/5+'!</div>'}if(n===20){clearInterval(timer);playing=false;el('msg').textContent='🏆 Hoàn thành! 20 điểm + '+Math.max(0,300-seconds)+' điểm tốc độ!'}else active=problems.findIndex((p,j)=>done[j]===undefined);render()}roomChange(0)</script></html>
